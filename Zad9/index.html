	<p>
		<dfn>Zasada zachowania pędu</dfn> mówi, że jeżeli na układ ciał nie działa
		wypadkowa siła zewnętrzna, całkowity pęd tego układu pozostaje stały.
		Ciała mogą przekazywać sobie pęd podczas zderzenia, ale suma ich pędów
		przed zderzeniem i po nim jest taka sama.
